name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build:
    name: Build Android APK (Somoy)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NPM Dependencies
        run: npm ci || npm install

      - name: Build Web Assets (Vite)
        run: npm run build

      - name: Initialize Android Project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Locate Generated APK
        id: find_apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Somoy-App-Android-APK
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30

      - name: Summary
        run: |
          echo "### 🎉 Android APK সফলভাবে বিল্ড হয়েছে!" >> $GITHUB_STEP_SUMMARY
          echo "আপনি GitHub Actions-এর **Artifacts** সেকশন থেকে **Somoy-App-Android-APK** ডাউনলোড করে সরাসরি আপনার অ্যান্ড্রয়েড ফোনে ইনস্টল করতে পারবেন।" >> $GITHUB_STEP_SUMMARY
